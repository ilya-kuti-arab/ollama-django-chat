<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .model-selector {
            margin-bottom: 20px;
        }

        .model-selector label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ecf0f1;
        }

        #modelSelect {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #34495e;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #modelSelect:hover {
            background: #3d566e;
        }

        .refresh-models {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .refresh-models:hover {
            background: #2980b9;
        }

        .info {
            margin-top: auto;
            font-size: 0.8rem;
            text-align: center;
            color: #bdc3c7;
        }

        /* Main chat area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #333;
        }

        .chat-header p {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-role {
            font-size: 0.7rem;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        /* Input area */
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #promptInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        #promptInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>🤖 Ollama Chat</h2>
            <div class="model-selector">
                <label>Select Model:</label>
                <select id="modelSelect">
                    <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
                    <option value="mistral">mistral</option>
                    <option value="codellama">codellama</option>
                </select>
            </div>
            <div class="info">
                <p>Powered by Ollama</p>
                <p style="font-size: 0.7rem; margin-top: 10px;">Make sure Ollama is running on localhost:11434</p>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header">
                <h1>AI Assistant</h1>
                <p>Ask me anything! I'm running locally on your machine.</p>
            </div>
            
            <div class="messages" id="messages">
                <div class="message assistant">
                    <div class="message-content">
                        <div class="message-role">Assistant</div>
                        Hello! I'm your AI assistant. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <input type="text" id="promptInput" placeholder="Type your message here..." />
                    <button id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isProcessing = false;

        async function loadModels() {
            try {
                const response = await fetch('/api/models/');
                const data = await response.json();
                
                if (data.success && data.models.length > 0) {
                    const select = document.getElementById('modelSelect');
                    const currentValue = select.value;
                    
                    select.innerHTML = '';
                    data.models.forEach(model => {
                        const option = document.createElement('option');
                        option.value = model;
                        option.textContent = model;
                        if (model === currentValue) {
                            option.selected = true;
                        }
                        select.appendChild(option);
                    });
                    
                    addSystemMessage('Models loaded successfully!', 'info');
                } else {
                    addSystemMessage('Failed to load models. Using defaults.', 'error');
                }
            } catch (error) {
                console.error('Error loading models:', error);
                addSystemMessage('Error loading models. Make sure Ollama is running.', 'error');
            }
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const promptInput = document.getElementById('promptInput');
            const prompt = promptInput.value.trim();
            
            if (!prompt) return;
            
            // Add user message
            addMessage(prompt, 'user');
            promptInput.value = '';
            
            // Add loading indicator
            const loadingMessage = addLoadingMessage();
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            
            try {
                const model = document.getElementById('modelSelect').value;
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: prompt
                    })
                });
                
                const data = await response.json();
                
                // Remove loading message
                loadingMessage.remove();
                
                if (data.success) {
                    addMessage(data.response, 'assistant');
                } else {
                    addMessage(`Error: ${data.error || 'Failed to get response'}`, 'error');
                }
            } catch (error) {
                loadingMessage.remove();
                addMessage(`Error: ${error.message}. Make sure Ollama is running on localhost:11434`, 'error');
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                promptInput.focus();
            }
        }
        
        function addMessage(text, role) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = role === 'user' ? 'You' : (role === 'assistant' ? 'Assistant' : 'System');
            
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            
            contentDiv.appendChild(roleDiv);
            contentDiv.appendChild(textDiv);
            messageDiv.appendChild(contentDiv);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function addSystemMessage(text, type) {
            addMessage(text, 'system');
        }
        
        function addLoadingMessage() {
            const messagesContainer = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = 'Assistant';
            
            const loadingIndicator = document.createElement('div');
            loadingIndicator.className = 'loading';
            
            contentDiv.appendChild(roleDiv);
            contentDiv.appendChild(loadingIndicator);
            loadingDiv.appendChild(contentDiv);
            
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            return loadingDiv;
        }
        
        // Allow pressing Enter to send message
        document.getElementById('promptInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        });
        
        // Load models on page load
        loadModels();
    </script>
</body>
</html>
